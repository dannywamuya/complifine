name: CI

# Tests run here on every push to a deployable branch (and on PRs into them).
# Schema migrations do not run in Actions — GitHub cannot reach Railway's
# private Postgres. They run once per API deploy as a Railway pre-deploy
# command (see apps/api/railway.toml and docs/RUNBOOK.md).

on:
  push:
    branches: [main, dev, staging]
  pull_request:
    branches: [main, dev, staging]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.2.21"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun test

      - name: Typecheck
        run: bun run typecheck
