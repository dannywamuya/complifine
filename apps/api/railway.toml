# API service on Railway.
#
# Root Directory MUST be empty (this git repo is already the Bun workspace).
# Do not set it to "complifine" or "apps/api" — workspace packages live in
# packages/ at the repo root, and Docker cannot COPY outside the build context.

[build]
builder = "DOCKERFILE"
dockerfilePath = "apps/api/Dockerfile"

[deploy]
healthcheckPath = "/ready"
healthcheckTimeout = 30
preDeployCommand = "sh scripts/predeploy.sh"
